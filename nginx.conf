server {
    # ATENÇÃO: Mudamos para a porta 3000. O Coolify reconhece apps em NodeJS 
    # e manda tráfego automaticamente para a porta 3000 por padrão.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve a aplicação Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso - O servidor fará a requisição à API (Burlando o CORS)
    location /api-datajud/ {
        # Otimizamos a rota do Proxy para evitar falhas de caminho
        proxy_pass [https://api-publica.datajud.cnj.jus.br/](https://api-publica.datajud.cnj.jus.br/);
        proxy_set_header Host api-publica.datajud.cnj.jus.br;
        proxy_ssl_server_name on;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
